services:
  - type: web
    name: elemarket-web
    env: node
    buildCommand: npm ci && npm run build:production
    startCommand: node scripts/start.mjs
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ELEMARKET_ENV
        value: production
      - key: NODE_VERSION
        value: 26
  - type: worker
    name: elemarket-scheduler
    env: node
    buildCommand: npm ci
    startCommand: node scripts/scheduler.mjs
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 26
      - key: ELEMARKET_SCHEDULER_BASE_URL
        fromService:
          name: elemarket-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
