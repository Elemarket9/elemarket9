name: Source and build checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan source and history for secrets
        run: |
          curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          GITLEAKS_ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz" python3 - <<'PYTHON'
          import hashlib, os
          with open(os.environ['GITLEAKS_ARCHIVE'], 'rb') as archive:
            assert hashlib.sha256(archive.read()).hexdigest() == '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          PYTHON
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          scan_status=0
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json" || scan_status=$?
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks-source.json" || scan_status=$?
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          for scope in ('history', 'source'):
            report = Path(os.environ['RUNNER_TEMP']) / f'gitleaks-{scope}.json'
            if not report.exists():
              print(f'{scope}: scanner did not produce a report; inspect the scanner error above')
              continue
            findings = json.loads(report.read_text()) or []
            for finding in findings:
              # Print location metadata only. Never print Secret, Match or source context.
              safe = {key: finding.get(key) for key in ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint')}
              print(f'{scope} finding: {json.dumps(safe, ensure_ascii=True)}')
          PYTHON
          exit "$scan_status"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Dependency security gate (collect remaining checks)
        id: root_security
        continue-on-error: true
        run: npm run security:ci
      - run: npm run check:architecture
      - run: npm run validate:deployment-package
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Enforce dependency security gate
        if: always() && steps.root_security.outcome == 'failure'
        run: exit 1
  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elemarket
          POSTGRES_PASSWORD: elemarket
          POSTGRES_DB: elemarket_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elemarket -d elemarket_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Apply migrations twice
        env:
          DATABASE_URL: postgresql://elemarket:elemarket@127.0.0.1:5432/elemarket_ci
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs
  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Mobile security audit (collect remaining checks)
        id: mobile_security
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: node node_modules/expo/bin/cli export --platform android --output-dir ${{ runner.temp }}/mobile-export
      - name: Enforce mobile security gate
        if: always() && steps.mobile_security.outcome == 'failure'
        run: exit 1
