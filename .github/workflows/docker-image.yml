name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag elemarket:ci --build-arg VITE_ELEMARKET_MARKETPLACE_ORIGIN=https://marketplace.example.com --build-arg VITE_ELEMARKET_SELLER_ORIGIN=https://seller.example.com --build-arg VITE_ELEMARKET_PROVIDER_ORIGIN=https://partners.example.com
